services:
  nginx:
    build: nginx/
    ports:
      - "443:443"
    volumes:
      - wp_volume:/usr/share/webapps/
    networks:
      - inception
    depends_on:
      - wordpress
  mariadb:
    build: mariadb/
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    env_file:
      - .env
    secrets:
      - db_password
    networks:
      - inception
  wordpress:
    build: wordpress/
    volumes:
      - wp_volume:/usr/share/webapps/
    networks:
      - inception
    depends_on:
      - mariadb
    secrets:
      - db_password
    env_file:
      - .env
volumes:
  db_data:
  wp_volume:
secrets:
  db_password:
    file: ./.secrets/db_password.txt
networks:
  inception:
    driver: bridge

